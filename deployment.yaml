apiVersion: apps/v1
kind: Deployment
metadata:
  name: inspireme-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inspireme
  template:
    metadata:
      labels:
        app: inspireme
    spec:
      containers:
      - name: inspireme
        image: inspireme:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
